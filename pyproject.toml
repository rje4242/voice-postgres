[project]
name = "voice-postgres"
version = "0.1.0"
description = "Talk to a local Postgres database with xAI's Speech to Speech Voice Agent API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Ehteshamzadeh" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
voice-postgres = "voice_postgres.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
