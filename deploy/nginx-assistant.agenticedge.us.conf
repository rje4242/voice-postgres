# Install (needs sudo):
#   sudo cp deploy/nginx-assistant.agenticedge.us.conf /etc/nginx/sites-available/assistant.agenticedge.us
#   sudo ln -sf /etc/nginx/sites-available/assistant.agenticedge.us /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d assistant.agenticedge.us --expand
#   sudo nginx -t && sudo systemctl reload nginx
#
# DNS already aliases assistant.agenticedge.us -> agenticedge.us.
# Expand the Let's Encrypt cert so it includes this name (current cert is only
# agenticedge.us + www). Until then TLS will warn in the browser.

server {
    listen 80;
    server_name assistant.agenticedge.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name assistant.agenticedge.us;

    ssl_certificate /etc/letsencrypt/live/agenticedge.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agenticedge.us/privkey.pem;

    client_max_body_size 8M;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
