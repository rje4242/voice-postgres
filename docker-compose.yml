services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: voice
      POSTGRES_PASSWORD: voice
      POSTGRES_DB: voice_postgres
    ports:
      - "55432:5432"
    volumes:
      - voice_pgdata:/var/lib/postgresql/data
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice -d voice_postgres"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  voice_pgdata:
